<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <title>Volunteer Form</title>
  </head>
  <body>
    <h1>Volunteer Form</h1>
    <form action="http://bloomingdale.sat.iit.edu/kriedan/lab3formscript.php" method="post">
      <fieldset>
        <legend>My Info</legend>
        <div>
          <label for="first_name">first name:</label>
          <input type="text" id="first_name" name="first_name_field" required>
        </div>
        <div>
          <label for="last_name">last name:</label>
          <input type="text" id="last_name" name="last_name_field" required>
        </div>
        <div>
          <label for="phone">phone:</label>
          <input type="tel" id="phone" name="phone" pattern="[0-9]{3}-[0-9]{3}-[0-9]{4}">
        </div>
        <div>
          <label for="email">email:</label>
          <input type="email" id="email" name="email_field" required>
        </div>
        <div>
          <label for="gender">Gender:</label><br>
          <input type="radio" id="gender_male" name="gender_field" value="male">
          <label for="gender_male">Male</label>
          <input type="radio" id="gender_female" name="gender_field" value="female">
          <label for="gender_female">Female</label>
        </div>
        <div>
          <label for="age">Age:</label><br>
          <select name="age_field" id="age">
            <option value="">Select</option>
            <option value="under-18">under 18</option>
            <option value="over 18">over 18</option>
          </select>
        </div>
      </fieldset>
      <fieldset>
        <legend>My Availability</legend>
        <div>
          <label for="availability_monday"><strong>Days Available:</strong></label><br>
          <input type="checkbox" id="availability_monday" name="available_field[]" value="monday">
          <label for="availability_monday">Monday</label><br>
          <input type="checkbox" id="availability_tuesday" name="available_field[]" value="tuesday">
          <label for="availability_tuesday">Tuesday</label><br>
          <input type="checkbox" id="availability_wednesday" name="available_field[]" value="wednesday">
          <label for="availability_wednesday">Wednesday</label><br>
          <input type="checkbox" id="availability_thursday" name="available_field[]" value="thursday">
          <label for="availability_thursday">Thursday</label><br>
          <input type="checkbox" id="availability_friday" name="available_field[]" value="friday">
          <label for="availability_friday">Friday</label>
        </div>
        <div>
          <label for="comments"><strong>Comments:</strong></label><br>
          <textarea id="comments" name="comment_field" rows="5" cols="40"></textarea>
        </div>
        <div>
          <input type="submit" value="Submit Query">
        </div>
        <input type="hidden" id="user_name" name="hidden_field" value="Joaquin Luengas Martinez">
      </fieldset>
    </form>
  </body>
</html>
